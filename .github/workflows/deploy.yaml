name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - app/**
      - requirements/**
      - Dockerfile.api
      - docker-compose.yml
      - .github/workflows/deploy.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: chanwoongyoon/devcompass-api:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Pull and restart API
        env:
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$EC2_USER@$EC2_HOST" "
            set -eu
            cd \"$EC2_APP_DIR\"
            docker compose pull api
            docker compose up -d api
            docker compose ps api
          "
