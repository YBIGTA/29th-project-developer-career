name: Deploy API

on:
  push:
    branches: [deployment]
    paths:
      - app/**
      - requirements/**
      - Dockerfile.api
      - docker-compose.yml
      - .github/workflows/deploy.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Update and restart API
        env:
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$EC2_USER@$EC2_HOST" "
            set -eu
            cd \"$EC2_APP_DIR\"
            git fetch origin deployment
            git checkout deployment
            git pull --ff-only origin deployment
            docker compose up -d --build api
            docker compose ps api
          "
