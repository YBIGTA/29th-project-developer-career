# 배치 전용 VM에서 사용하는 compose 파일. DB/API 컨테이너는 포함하지 않는다.
# DATABASE_URL 등은 이 VM의 .env가 API 서버 VM의 DB를 가리키도록 설정해야 한다.
#
# 사용법:
#   scp -r app requirements Dockerfile.batch deploy/docker-compose.batch.yml .env <batch-vm>:~/devcompass/
#   ssh <batch-vm> 'cd ~/devcompass && docker compose -f docker-compose.batch.yml run --rm batch'
#
# 주기 실행은 이 VM의 cron/systemd timer로 위 run 커맨드를 예약한다.
services:
  batch:
    build:
      context: ..
      dockerfile: Dockerfile.batch
    env_file:
      - ../.env
