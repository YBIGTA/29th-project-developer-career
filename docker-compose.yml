# 로컬 개발용. 실제 배포에서는 API 서버(Dockerfile.api)와 데이터 수집 파이프라인
# (pipelines/jobs, pipelines/ecosystem, Fargate)이 서로 다른 곳에서 각자 뜬다.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devcompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devcompass}
      POSTGRES_DB: ${POSTGRES_DB:-devcompass}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    image: chanwoongyoon/devcompass-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"

  # 1회성 배치 컨테이너. `docker compose up`으로는 뜨지 않고 profile로만 실행된다.
  #   docker compose --profile jobs run --rm jobs
  #   docker compose --profile ecosystem run --rm ecosystem
  # DB 접속 호스트는 compose 네트워크 안이므로 .env의 DATABASE_URL/DEVCOMPASS_DSN이
  # localhost가 아니라 db(서비스명)를 가리켜야 한다.
  jobs:
    build:
      context: pipelines/jobs
    env_file:
      - .env
    depends_on:
      - db
    profiles:
      - jobs

  ecosystem:
    build:
      context: pipelines/ecosystem
    env_file:
      - .env
    depends_on:
      - db
    profiles:
      - ecosystem

volumes:
  db_data:
