[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devcompass-collector"
version = "0.1.0"
description = "DevCompass public ATS collection pipeline"
requires-python = ">=3.9"
dependencies = [
    "joblib==1.5.3",
    "psycopg[binary]>=3.2,<4",
    "scikit-learn==1.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]
